2 py-0.5 rounded text-[12px] font-bold mr-2 shadow-sm border border-blue-200 inline-block align-middle\\\">25\\u003c/span>Skating Star \\u003cdiv id=\\\"drop-auto-4\\\" class=\\\"drop-zone cursor-pointer inline-block align-middle\\\" onclick=\\\"handleDropZoneClick(event)\\\" ondrop=\\\"drop(event)\\\" ondragover=\\\"allowDrop(event)\\\" ondragleave=\\\"dragLeave(event)\\\" title=\\\"Nhấn để bỏ Option đã kéo\\\">\\u003c/div> \\u003cspan class=\\\"play-here-btn\\\" data-time=\\\"182.650\\\" onclick=\\\"playAudioFrom(182.650)\\\" title=\\\"Phát audio tại đây\\\">\\u003ci class=\\\"fa-solid fa-play text-[10px]\\\">\\u003c/i>\\u003c/span>\\u003c/div>\\u003c/div>\",\"totalQs\":5,\"rawTranscript\":\"{t:0.299, text:'Now, look at part 5.'},\\n{t:6.749, text:'For each question, choose the correct answer.'},\\n{t:9.925, text:'Look at questions 21 to 25 now.'},\\n{t:13.850, text:'You have 15 seconds.'},\\n{t:30.925, text:'Are you reading that book for school, Jade?'},\\n{t:33.749, text:'Yes, it\\\\'s called the delay.'},\\n{t:36.001, text:'It\\\\'s about chemistry and there\\\\'s lots of good'},\\n{t:39.034, text:'information I can use for my school project.'},\\n{t:42.274, text:'Oh, so it isn\\\\'t a story.'},\\n{t:46.349, text:'Not really, but the last book we read at school'},\\n{t:50.301, text:'was, it was called Crunch, and it was great.'},\\n{t:54.599, text:'I finished it too quickly. In an hour, I wanted to read it for days.'},\\n{t:61.001, text:'Have you read any more good books?'},\\n{t:63.001, text:'Yes, our teacher gave us my island.'},\\n{t:67.099, text:'It really made me laugh a lot.'},\\n{t:70.001, text:'I wasn\\\\'t bored reading it at all.'},\\n{t:72.449, text:'Didn\\\\'t you read dangerous animals?'},\\n{t:75.399, text:'Yes, it\\\\'s not scary, but it was difficult to read.'},\\n{t:81.001, text:'There were lots of words I didn\\\\'t know.'},\\n{t:83.001, text:'Okay.'},\\n{t:84.749, text:'I also read the invitation.'},\\n{t:87.799, text:'I cried when I read that, especially the beginning bit.'},\\n{t:91.199, text:'Did you finish it?'},\\n{t:93.649, text:'Yes, and I finished skating star last week.'},\\n{t:97.124, text:'Was that good?'},\\n{t:99.649, text:'Yes, the first bit was best, but the rest was good too.'},\\n{t:105.899, text:'There was a short programme about the writer on TV last week.'},\\n{t:109.124, text:'Interesting.'},\\n{t:115.799, text:'Now, listen again.'},\\n{t:119.899, text:'Are you reading that book for school, Jade?'},\\n{t:122.699, text:'Yes, it\\\\'s called The Delay.'},\\n{t:125.001, text:'It\\\\'s about chemistry, and there\\\\'s lots of good'},\\n{t:128.067, text:'information I can use for my school project.'},\\n{t:131.250, text:'Oh, so it isn\\\\'t a story.'},\\n{t:135.325, text:'Not really, but the last book we read at school'},\\n{t:138.772, text:'was, it was called Crunch, and it was great.'},\\n{t:142.001, text:'I finished it too quickly.'},\\n{t:145.001, text:'In an hour, I wanted to read it for days.'},\\n{t:149.001, text:'Have you read any more good books?'},\\n{t:151.200, text:'Yes, our teacher gave us my island.'},\\n{t:155.001, text:'It really made me laugh a lot.'},\\n{t:158.100, text:'I wasn\\\\'t bored reading it at all.'},\\n{t:161.400, text:'Didn\\\\'t you read dangerous animals?'},\\n{t:164.400, text:'Yes, it\\\\'s not scary, but it was difficult to read.'},\\n{t:169.001, text:'There were lots of words I didn\\\\'t know.'},\\n{t:172.001, text:'Okay.'},\\n{t:173.750, text:'I also read the invitation.'},\\n{t:176.750, text:'I cried when I read that, especially the beginning bit.'},\\n{t:180.175, text:'Did you finish it?'},\\n{t:182.650, text:'Yes, and I finished skating star last week.'},\\n{t:186.100, text:'Was that good?'},\\n{t:188.600, text:'Yes, the first bit was best, but the rest was good too.'},\\n{t:194.900, text:'There was a short program about the writer on TV last week.'},\\n{t:199.001, text:'Interesting.'},\\n{t:205.150, text:'That is the end of Part 5.'},\\n\",\"rawQuestions\":\"[VOCAB]\\ntoo short | finished it too quickly, in an hour\\nfunny | made me laugh a lot\\nhard to understand | difficult to read, lots of words I didn't know\\nsad | cried when I read that\\ngood beginning | the first bit was best\\n[/VOCAB]\\n\\nYou will hear a girl talking to her uncle about the books she has read at school. How does she feel about each book?\\nBooks\\nFeelings\\n\\nA. boring\\nB. funny\\nC. good beginning\\nD. hard to understand\\nE. sad\\nF. scary\\nG. too short\\nH. useful\\n\\n21 Crunch ___ [play:138.772]\\n22 My Island ___ [play:151.200]\\n23 Dangerous Animals ___ [play:161.400]\\n24 The Invitation ___ [play:173.750]\\n25 Skating Star ___ [play:182.650]\"}];\n        let currentLessonIndex = 0;\n        let timerInterval; let seconds = 0;\n        let activePara = null;\n\n        function allowDrop(ev) { ev.preventDefault(); ev.currentTarget.classList.add('drag-over'); }\n        function dragLeave(ev) { ev.currentTarget.classList.remove('drag-over'); }\n        \n        function drag(ev) { \n            const val = ev.target.dataset.val || ev.target.innerText.split('.')[0].trim();\n            ev.dataTransfer.setData(\"text\", val); \n            ev.dataTransfer.setData(\"sourceId\", ev.target.id);\n        }\n        \n        function drop(ev) { \n            ev.preventDefault(); \n            ev.currentTarget.classList.remove('drag-over'); \n            const data = ev.dataTransfer.getData(\"text\"); \n            const sourceId = ev.dataTransfer.getData(\"sourceId\");\n            const lesson = lessonsData[currentLessonIndex];\n            \n            // Nhận diện xem đây có phải là Option của dạng Vocab hay không\n            const isVocab = sourceId && sourceId.includes('drag-vocab');\n\n            // Hoàn trả lại item cũ nếu drop-zone đã có item\n            if ((lesson.removeDragged || isVocab) && ev.currentTarget.dataset.sourceId) {\n                const oldSource = document.getElementById(ev.currentTarget.dataset.sourceId);\n                if(oldSource) {\n                    oldSource.classList.remove('used');\n                    oldSource.style.display = ''; // Hiện lại nếu bị ẩn\n                }\n            }\n\n            ev.currentTarget.innerHTML = `<span class=\"dropped-item\">${data}</span>`; \n            ev.currentTarget.dataset.value = data.split('.')[0].trim(); \n            ev.currentTarget.dataset.sourceId = sourceId;\n\n            // Xử lý biến mất/làm mờ item mới kéo vào\n            if ((lesson.removeDragged || isVocab) && sourceId) {\n                const sourceEl = document.getElementById(sourceId);\n                if(sourceEl) {\n                    if (isVocab) {\n                        sourceEl.style.display = 'none'; // Biến mất HOÀN TOÀN với phần Vocab\n                    } else {\n                        sourceEl.classList.add('used'); // Chỉ làm mờ, gạch ngang với dạng kéo thả khác\n                    }\n                }\n            }\n            updatePaletteState();\n        }\n\n        // Xử lý Click vào Drop Zone để trả item về danh sách gốc\n        function handleDropZoneClick(ev) {\n            const lesson = lessonsData[currentLessonIndex];\n            const dz = ev.currentTarget;\n            const sourceId = dz.dataset.sourceId;\n            const isVocab = sourceId && sourceId.includes('drag-vocab');\n\n            // Nếu không phải vocab và cũng không tick checkbox \"Ẩn Opt Đã Kéo\" thì bỏ qua\n            if (!lesson.removeDragged && !isVocab) return;\n            \n            if (sourceId) {\n                const sourceEl = document.getElementById(sourceId);\n                if (sourceEl) {\n                    sourceEl.classList.remove('used');\n                    sourceEl.style.display = ''; // Phục hồi hiển thị cho item\n                }\n                dz.innerHTML = '';\n                dz.dataset.value = '';\n                dz.dataset.sourceId = '';\n            }\n            updatePaletteState();\n        }\n\t\t\n\t\twindow.checkVocabMatching = function(btn) {\n            const block = btn.closest('.vocab-block');\n            if (!block) return;\n            \n            const dropZones = block.querySelectorAll('.drop-zone');\n            \n            let correct = 0;\n            let total = dropZones.length;\n            \n            // Xóa các nút show key và thông báo cũ nếu học sinh bấm check nhiều lần\n            block.querySelectorAll('.vocab-show-key-btn, .correct-feedback').forEach(e => e.remove());\n            \n            dropZones.forEach(el => {\n                el.classList.remove('correct-answer', 'incorrect-answer');\n                \n                // Lấy đáp án đúng đã được gài sẵn\n                const correctVal = (el.dataset.answer || \"\").trim().toLowerCase();\n                let userVal = (el.dataset.value || \"\").trim().toLowerCase();\n                \n                if (userVal === correctVal && userVal !== \"\") {\n                    correct++;\n                    el.classList.add('correct-answer');\n                } else {\n                    el.classList.add('incorrect-answer');\n                    \n                    // Thêm nút Show Key bên cạnh ô làm sai\n                    if(correctVal) {\n                        const showKeyBtn = document.createElement('button');\n                        showKeyBtn.className = 'vocab-show-key-btn ml-2 bg-gray-200 hover:bg-gray-300 text-gray-700 text-[10px] px-2 py-1 rounded font-bold transition inline-block align-middle shadow-sm border border-gray-300';\n                        showKeyBtn.innerHTML = '<i class=\"fa-solid fa-key\"></i> Show Key';\n                        showKeyBtn.onclick = function() {\n                            const div = document.createElement('div');\n                            div.className = 'correct-feedback mt-1';\n                            div.innerText = `Key: ${el.dataset.answer}`;\n                            el.after(div);\n                            this.remove(); // Ẩn nút đi sau khi đã show\n                        };\n                        el.after(showKeyBtn);\n                    }\n                }\n            });\n            \n            // Hiển thị điểm số phần Vocab\n            const feedback = block.querySelector('.vocab-feedback');\n            if (feedback) {\n                feedback.innerText = `Kết quả Vocab: ${correct}/${total} câu chính xác`;\n                feedback.classList.remove('hidden');\n            }\n        };\n\n        // Thay thế hàm switchLesson cũ bằng hàm mới này\n        // Hàm chụp ảnh trạng thái bài làm\n        window.saveCurrentStateToMemory = () => {\n            if (currentLessonIndex === undefined || currentLessonIndex === null || !lessonsData[currentLessonIndex]) return;\n\n            // Đồng bộ value cho input text và gap-fill\n            document.querySelectorAll('#questions-content input[type=\"text\"]').forEach(el => {\n                el.setAttribute('value', el.value || '');\n            });\n            // Đồng bộ trạng thái checked cho trắc nghiệm (radio/checkbox)\n            document.querySelectorAll('#questions-content input[type=\"checkbox\"], #questions-content input[type=\"radio\"]').forEach(el => {\n                if(el.checked) el.setAttribute('checked', 'checked');\n                else el.removeAttribute('checked');\n            });\n\n            const qContent = document.getElementById('questions-content');\n            if (qContent && qContent.innerHTML.trim() !== '') {\n                lessonsData[currentLessonIndex].savedDOM = {\n                    questions: qContent.innerHTML,\n                    timer: seconds, // Lưu lại số giây đã đếm\n                    resultMessage: document.getElementById('result-message').innerHTML,\n                    resultMessageHidden: document.getElementById('result-message').classList.contains('hidden')\n                };\n            }\n        };\n\n        // Thay thế hàm switchLesson cũ bằng hàm mới này\n        function switchLesson(index) {\n            // 1. Lưu bài cũ trước khi chuyển đi (ngăn lưu nhầm mảng rỗng khi ở sảnh chờ)\n            const qContent = document.getElementById('questions-content');\n            if (typeof saveCurrentStateToMemory === 'function' && qContent && qContent.innerHTML.trim() !== '' && !document.body.classList.contains('in-dashboard')) {\n                saveCurrentStateToMemory();\n            }\n\n            currentLessonIndex = parseInt(index);\n            const lesson = lessonsData[currentLessonIndex];\n            \n            // 2. Render lại Audio, Transcript và cấu trúc cột\n            renderLesson(lesson);\n            const qsLabel = document.getElementById('top-total-qs');\n            if(qsLabel) qsLabel.innerText = (lesson.totalQs || 0) + ' câu';\n            \n            // 3. KIỂM TRA: Phục hồi trạng thái câu hỏi & đáp án nếu đã lưu\n            if (lesson.savedDOM) {\n                // Đắp lại HTML các đáp án đã điền/kéo thả\n                document.getElementById('questions-content').innerHTML = lesson.savedDOM.questions;\n                \n                // Khôi phục khung kết quả Xanh/Đỏ\n                const msg = document.getElementById('result-message');\n                msg.innerHTML = lesson.savedDOM.resultMessage;\n                if(lesson.savedDOM.resultMessageHidden) msg.classList.add('hidden');\n                else msg.classList.remove('hidden');\n\n                // Khôi phục đồng hồ tính giờ\n                if(timerInterval) clearInterval(timerInterval);\n                seconds = lesson.savedDOM.timer || 0;\n                timerInterval = setInterval(() => {\n                    seconds++;\n                    const m = Math.floor(seconds/60).toString().padStart(2, '0');\n                    const s = (seconds%60).toString().padStart(2, '0');\n                    document.getElementById('timer').innerText = `${m}:${s}`;\n                }, 1000);\n            } else {\n                // Chưa có dữ liệu lưu thì tạo mới từ đầu\n                resetState();\n            }\n\t\t\t// Đồng bộ lại nút Nộp Bài trên Header theo trạng thái của bài hiện tại\n    const btn = document.querySelector('button[onclick=\"checkResults()\"]');\n    if (btn) {\n        if (lesson.submitAttempt === 2 && !lesson.lastResult) {\n            btn.innerHTML = '<i class=\"fa-solid fa-rotate-right mr-1\"></i> Nộp Lần 2';\n            btn.className = 'bg-amber-500 hover:bg-amber-600 text-white text-sm font-bold px-4 py-1.5 rounded shadow transition';\n            btn.disabled = false;\n        } else if (lesson.lastResult) {\n            btn.innerHTML = '<i class=\"fa-solid fa-check mr-1\"></i> Đã Nộp';\n            btn.className = 'bg-gray-500 text-white text-sm font-bold px-4 py-1.5 rounded shadow cursor-not-allowed opacity-70';\n            btn.disabled = true;\n        } else {\n            btn.innerHTML = '<i class=\"fa-solid fa-check mr-1\"></i> Nộp Bài';\n            btn.className = 'bg-green-600 hover:bg-green-700 text-white text-sm font-bold px-4 py-1.5 rounded shadow transition';\n            btn.disabled = false;\n        }\n    }\n\tbuildPalette(lesson);\n    const bottomActions = document.getElementById('bottom-actions');\n    const btnNext = document.getElementById('btn-next-lesson');\n    if(lesson.lastResult || lesson.submitAttempt >= 2) {\n        bottomActions.classList.remove('hidden');\n        \n        const filterVal = document.querySelector('input[name=\"lesson_filter\"]:checked').value;\n        if (filterVal === 'ALL') {\n            if (currentTestSequence.length > 0) {\n                btnNext.classList.remove('hidden');\n                let currentIndex = currentTestSequence.indexOf(currentLessonIndex);\n                if (currentIndex < currentTestSequence.length - 1) {\n                    btnNext.innerText = `Bài tiếp theo (Phím ➔) ❯❯`;\n                } else {\n                    btnNext.innerText = `Nộp & Xem Report ❯❯`;\n                }\n            } else {\n                btnNext.classList.add('hidden');\n            }\n        } else {\n            if (filteredIndexes.length > 1) {\n                btnNext.classList.remove('hidden');\n                btnNext.innerText = `Bài ngẫu nhiên tiếp theo (Phím ➔) ❯❯`;\n            } else btnNext.classList.add('hidden');\n        }\n    } else {\n        bottomActions.classList.add('hidden');\n    }\n        }\n\n        function renderLesson(lesson) {\n            const audio = document.getElementById('audio');\n            audio.src = lesson.audio;\n            document.getElementById('transcript').innerHTML = lesson.processedTranscript;\n            document.getElementById('questions-content').innerHTML = lesson.processedQuestions;\n\n            const transWrap = document.getElementById('transcript-container');\n            const transPlace = document.getElementById('transcript-placeholder');\n            document.getElementById('trans-btn-container').innerHTML = `<span class=\"text-xs text-slate-400\"><i class=\"fa-solid fa-music mr-1\"></i>Audio Source</span>\n                <button onclick=\"toggleTrans()\" class=\"bg-slate-700 hover:bg-slate-600 text-white px-3 py-1 rounded text-xs transition border border-slate-500\">${lesson.hideTrans ? 'Hiện Văn Bản' : 'Ẩn Văn Bản'}</button>`;\n            \n            if (lesson.hideTrans) { transWrap.classList.add('hidden'); transPlace.classList.remove('hidden'); }\n            else { transWrap.classList.remove('hidden'); transPlace.classList.add('hidden'); }\n\t\t\t\n            const paneTrans = document.getElementById('pane-transcript');\n            const paneQuest = document.getElementById('pane-questions');\n            const resizer1 = document.getElementById('resizer-1');\n\n            paneTrans.style.width = '';                 \n            paneQuest.style.width = '';\n            \n            const questContentWrap = paneQuest.querySelector('.max-w-full');\n            if(questContentWrap) {\n                questContentWrap.classList.remove('max-w-full', 'w-full');\n                questContentWrap.classList.add('max-w-3xl');\n            }\n            document.getElementById('questions-content').classList.remove('text-lg');\n\n            attachAudioListeners();\n            setTimeout(initResize, 100);\n        }\n\n        function toggleTrans() {\n            document.getElementById('transcript-container').classList.toggle('hidden');\n            document.getElementById('transcript-placeholder').classList.toggle('hidden');\n        }\n\n        function resetState() {\n            document.getElementById('result-message').classList.add('hidden');\n            seconds = 0; if(timerInterval) clearInterval(timerInterval);\n            timerInterval = setInterval(() => {\n                seconds++;\n                const m = Math.floor(seconds/60).toString().padStart(2, '0');\n                const s = (seconds%60).toString().padStart(2, '0');\n                document.getElementById('timer').innerText = `${m}:${s}`;\n            }, 1000);\n        }\n\n        function attachAudioListeners() {\n            const audio = document.getElementById('audio');\n            const paras = document.querySelectorAll('#transcript p');\n            activePara = null;\n            \n            // --- LOGIC MỚI: Thu thập thời gian của tất cả các nút Play ---\n            const playBtns = document.querySelectorAll('.play-here-btn');\n            let qTimings = [];\n            playBtns.forEach(btn => {\n                const time = parseFloat(btn.dataset.time);\n                if (!isNaN(time)) qTimings.push({ btn, time });\n            });\n            // Sắp xếp các nút theo thứ tự thời gian từ bé đến lớn\n            qTimings.sort((a, b) => a.time - b.time);\n\n            audio.ontimeupdate = () => {\n                const time = audio.currentTime;\n                const alerts = document.querySelectorAll('.alert-trigger');\n                let current = null;\n                \n                paras.forEach(p => {\n                    const t = parseFloat(p.dataset.time);\n                    p.classList.remove('active');\n                    if (time >= t) current = p;\n                });\n\n                if (current) {\n                    current.classList.add('active');\n                    if (!document.getElementById('transcript-container').classList.contains('hidden')) {\n                        if (current !== activePara) current.scrollIntoView({ behavior: 'smooth', block: 'center' });\n                    }\n                    activePara = current;\n\n                    // Sparkles trigger\n                    current.querySelectorAll('.keyword-sparkle').forEach(sp => {\n                        sp.classList.remove('trigger');\n                        void sp.offsetWidth;\n                        sp.classList.add('trigger');\n                        const targetId = sp.dataset.targetInput;\n                        if (targetId) {\n                            const inputEl = document.getElementById(targetId);\n                            if (inputEl) {\n                                inputEl.classList.add('highlight-input');\n                                setTimeout(() => inputEl.classList.remove('highlight-input'), 2000);\n                            }\n                        }\n                    });\n                }\n                \n                // Alerts trigger\n                alerts.forEach(al => {\n                    let parentP = al.closest('p');\n                    if(!parentP) {\n                        let prev = al.previousElementSibling;\n                        while(prev && prev.tagName !== 'P') prev = prev.previousElementSibling;\n                        if(prev) parentP = prev;\n                    }\n                    if(parentP && parentP.dataset.time) {\n                        const t = parseFloat(parentP.dataset.time);\n                        if (time >= t && time < t + 1) {\n                            const targetId = al.dataset.targetQuestion;\n                            if (targetId) {\n                                const block = document.getElementById(targetId);\n                                if(block) { \n                                    block.classList.add('highlight-block'); \n                                    setTimeout(() => block.classList.remove('highlight-block'), 5000); \n                                    block.scrollIntoView({ behavior: 'smooth', block: 'center' }); \n                                }\n                            }\n                        }\n                    }\n                });\n\n                // --- LOGIC MỚI: Dò tìm và thả Dấu Tick Xanh & Chuông Chú Ý ---\n                for (let i = 0; i < qTimings.length; i++) {\n                    const currentQ = qTimings[i];\n                    const nextQ = qTimings[i+1];\n                    \n                    // 1. XỬ LÝ CHUÔNG BÁO CHÚ Ý (Nếu công tắc được bật)\n                    const bellToggle = document.getElementById('bell-toggle');\n                    if (bellToggle && bellToggle.checked) {\n                        // Kích hoạt khi qua mốc time một chút (0 - 1.5s để chặn sai số nếu học sinh tua nhanh)\n                        if (time >= currentQ.time && time < currentQ.time + 1.5) {\n                            if (!currentQ.bellRinging) {\n                                currentQ.bellRinging = true;\n                                const bell = document.createElement('span');\n                                bell.className = 'attention-bell';\n                                bell.innerHTML = '<i class=\"fa-solid fa-bell mr-1\"></i> Chú ý';\n                                currentQ.btn.after(bell); // Thả chuông ngay cạnh nút Play\n                                \n                                // Tự động xóa chuông sau 3 giây\n                                setTimeout(() => {\n                                    if (bell.parentNode) bell.remove();\n                                }, 3000);\n                            }\n                        } else if (time < currentQ.time) {\n                            // Reset trạng thái nếu học sinh tua ngược audio về trước\n                            currentQ.bellRinging = false; \n                        }\n                    }\n\n                    // 2. XỬ LÝ DẤU TICK HOÀN THÀNH\n                    let isDone = false;\n                    if (nextQ) {\n                        if (time >= nextQ.time) isDone = true;\n                    } else {\n                        if (time >= currentQ.time + 15 || audio.ended) isDone = true;\n                    }\n                    \n                    // Tìm dấu tick xanh an toàn (tránh đụng chạm element chuông)\n                    let tickEl = null;\n                    let sibling = currentQ.btn.nextElementSibling;\n                    while (sibling) {\n                        if (sibling.classList.contains('done-tick')) {\n                            tickEl = sibling; \n                            break;\n                        }\n                        sibling = sibling.nextElementSibling;\n                    }\n                    \n                    if (isDone) {\n                        if (!tickEl) {\n                            const tick = document.createElement('i');\n                            tick.className = 'fa-solid fa-circle-check done-tick';\n                            tick.title = \"Audio đã phát qua phần này\";\n                            currentQ.btn.after(tick); \n                        }\n                    } else {\n                        if (tickEl) tickEl.remove(); // Thu hồi nếu tua ngược\n                    }\n                }\n            };\n            \n            paras.forEach(p => { \n                p.onclick = () => { \n                    audio.currentTime = parseFloat(p.dataset.time); \n                    audio.play(); \n                }; \n            });\n        }\n\n        function initResize() {\n           const mainContainer = document.getElementById('main-container');\n           if(!mainContainer || window.innerWidth < 768) return; \n\n           const resizer1 = document.getElementById('resizer-1');\n           const paneTrans = document.getElementById('pane-transcript');\n           if(resizer1 && paneTrans) {\n               const newResizer1 = resizer1.cloneNode(true);\n               resizer1.parentNode.replaceChild(newResizer1, resizer1);\n               newResizer1.addEventListener('mousedown', function(e) {\n                   e.preventDefault(); newResizer1.classList.add('active'); document.body.style.cursor = 'col-resize';\n                   const startX = e.clientX; const startWidth = paneTrans.getBoundingClientRect().width; const containerWidth = mainContainer.getBoundingClientRect().width;\n                   function onMouseMove(e) { const dx = e.clientX - startX; let newWidth = ((startWidth + dx) / containerWidth) * 100; if(newWidth < 20) newWidth = 20; if(newWidth > 60) newWidth = 60; paneTrans.style.width = newWidth + '%'; }\n                   function onMouseUp() { newResizer1.classList.remove('active'); document.body.style.cursor = ''; document.removeEventListener('mousemove', onMouseMove); document.removeEventListener('mouseup', onMouseUp); }\n                   document.addEventListener('mousemove', onMouseMove); document.addEventListener('mouseup', onMouseUp);\n               });\n           }\n        }\n        window.addEventListener('resize', initResize);\n\n        function checkResults() {\n    const lesson = lessonsData[currentLessonIndex];\n    const key = lesson.answerKey;\n    let score = 0; let total = 0;\n    if(Object.keys(key).length === 0) return alert(\"Chưa cài đặt đáp án.\");\n\n    // Khởi tạo biến đếm số lần nộp bài (mặc định là 1)\n    if (!lesson.submitAttempt) lesson.submitAttempt = 1;\n\n    document.querySelectorAll('.correct-feedback').forEach(e => e.remove());\n    document.querySelectorAll('.correct-answer, .incorrect-answer, .correct-text').forEach(e => e.classList.remove('correct-answer', 'incorrect-answer', 'correct-text'));\n\n    for(const [id, val] of Object.entries(key)) {\n        const el = document.getElementById(id);\n        if(el && (el.tagName === 'INPUT' || el.classList.contains('drop-zone'))) {\n            total++;\n            let userVal = el.tagName === 'INPUT' ? el.value.trim().toLowerCase() : (el.dataset.value || \"\").trim().toLowerCase();\n            const options = val.split(/[,\\/]/).map(s => s.trim().toLowerCase());\n            \n            if(options.includes(userVal)) {\n                score++; \n                el.classList.add('correct-answer');\n            } else {\n                el.classList.add('incorrect-answer');\n                // CHỈ HIỆN ĐÁP ÁN NẾU LÀ LẦN NỘP THỨ 2\n                if (lesson.submitAttempt >= 2) {\n                    const div = document.createElement('div'); \n                    div.className = 'correct-feedback'; \n                    div.innerText = `Correct: ${val}`; \n                    el.after(div);\n                }\n            }\n        } else {\n            const inputs = document.getElementsByName(id);\n            if(inputs.length > 0) {\n                const type = inputs[0].type;\n                if(type === 'radio') {\n                    total++;\n                    let selected = \"\"; \n                    for(let i of inputs) if(i.checked) selected = i.value.toUpperCase();\n                    if(selected === val.toUpperCase()) { score++; }\n                    \n                    for(let i of inputs) {\n                        const char = i.value.toUpperCase();\n                        const target = i.closest('td') || i.parentElement;\n                        \n                        if (i.checked && char === val.toUpperCase()) {\n                            // Chọn đúng\n                            target.classList.add('correct-text');\n                        } else if (i.checked && char !== val.toUpperCase()) {\n                            // Chọn sai\n                            target.classList.add('incorrect-answer');\n                        } else if (!i.checked && char === val.toUpperCase()) {\n                            // Bỏ lỡ đáp án đúng -> CHỈ SHOW Ở LẦN 2\n                            if (lesson.submitAttempt >= 2) {\n                                target.classList.add('correct-text');\n                            }\n                        }\n                    }\n                } else if(type === 'checkbox') {\n                    const keyArr = val.toUpperCase().split(/[,\\s/&]+/).filter(x=>x);\n                    total += keyArr.length;\n                    let correctCount = 0;\n                    \n                    for(let i of inputs) {\n                        const char = i.parentElement.innerText.trim().charAt(0).toUpperCase();\n                        if(i.checked) {\n                            if(keyArr.includes(char)) {\n                                correctCount++;\n                                i.parentElement.classList.add('correct-text');\n                            } else {\n                                i.parentElement.classList.add('incorrect-answer');\n                            }\n                        } else {\n                            // Bỏ lỡ đáp án đúng -> CHỈ SHOW Ở LẦN 2\n                            if(keyArr.includes(char) && lesson.submitAttempt >= 2) {\n                                i.parentElement.classList.add('correct-text');\n                            }\n                        }\n                    }\n                    score += correctCount;\n                }\n            }\n        }\n    }\n    \n    // Tùy biến Nút Submit & Cảnh báo dựa theo số lần nộp\n    const msg = document.getElementById('result-message');\n    const btn = document.querySelector('button[onclick=\"checkResults()\"]');\n\n    if (lesson.submitAttempt === 1 && score < total) {\n        // Lần 1: Còn câu sai -> Cho làm lại\n        msg.innerText = `Bạn làm đúng ${score}/${total} câu. Hãy kiểm tra lại những câu sai (màu đỏ) và nộp bài lần nữa nhé!`;\n        msg.classList.remove('hidden');\n        \n        if (btn) {\n            btn.innerHTML = '<i class=\"fa-solid fa-rotate-right mr-1\"></i> Nộp Lần 2';\n            btn.className = 'bg-amber-500 hover:bg-amber-600 text-white text-sm font-bold px-4 py-1.5 rounded shadow transition';\n        }\n        lesson.submitAttempt = 2; // Tăng mốc để lần bấm sau sẽ chốt sổ\n    } else {\n        // Lần 2 HOẶC Lần 1 đúng 100% -> Chốt sổ\n        msg.innerText = `Kết quả cuối cùng: ${score}/${total} câu đúng`;\n        msg.classList.remove('hidden');\n        \n        if (btn) {\n            btn.innerHTML = '<i class=\"fa-solid fa-check mr-1\"></i> Đã Nộp';\n            btn.className = 'bg-gray-500 text-white text-sm font-bold px-4 py-1.5 rounded shadow cursor-not-allowed opacity-70';\n            btn.disabled = true; // Khóa nút nộp\n        }\n        \n        // Lưu kết quả và dừng đồng hồ\n        if(window.timerInterval) clearInterval(window.timerInterval);\n        lessonsData[currentLessonIndex].lastResult = score + \"/\" + total;\n        // Bổ sung dữ liệu chi tiết cho Report\n        lessonsData[currentLessonIndex].scoreInfo = { correct: score, total: total };\n        lessonsData[currentLessonIndex].timeTaken = document.getElementById('timer').innerText;\n\t\t\n\t\t// --- THÊM CODE GỬI BÁO CÁO PART LẺ Ở ĐÂY ---\n        const filterVal = document.querySelector('input[name=\"lesson_filter\"]:checked').value;\n        if (filterVal !== 'ALL') {\n            let timeParts = document.getElementById('timer').innerText.split(':');\n            let timeSpent = parseInt(timeParts[0]) * 60 + parseInt(timeParts[1]);\n            sendReportToSheet(score, total, timeSpent);\n        }\n        // ------------------------------------------\n        \n        // Chỉ lưu thời điểm lần đầu tiên chốt sổ để giữ nguyên lịch sử\n        if(!lessonsData[currentLessonIndex].dateCompleted) {\n            const now = new Date();\n            lessonsData[currentLessonIndex].dateCompleted = `${now.getHours()}:${now.getMinutes()}:${now.getSeconds()} ${now.getDate()}/${now.getMonth()+1}/${now.getFullYear()}`;\n        }\n    }\n\t\n\tupdatePaletteState(); // Cập nhật màu đỏ/xanh lá cây\n    document.getElementById('bottom-actions').classList.remove('hidden');\n    const btnNext = document.getElementById('btn-next-lesson');\n    const filterVal = document.querySelector('input[name=\"lesson_filter\"]:checked').value;\n    if (filterVal === 'ALL') {\n        if (currentTestSequence.length > 0) {\n            btnNext.classList.remove('hidden');\n            let currentIndex = currentTestSequence.indexOf(currentLessonIndex);\n            if (currentIndex < currentTestSequence.length - 1) {\n                btnNext.innerText = `Bài tiếp theo (Phím ➔) ❯❯`;\n            } else {\n                btnNext.innerText = `Nộp & Xem Report ❯❯`;\n            }\n        } else {\n            btnNext.classList.add('hidden');\n        }\n    } else {\n        if (filteredIndexes.length > 1) {\n            btnNext.classList.remove('hidden');\n            btnNext.innerText = `Bài ngẫu nhiên tiếp theo (Phím ➔) ❯❯`;\n        } else btnNext.classList.add('hidden');\n    }\n}\n\n        window.onload = () => {\n            renderDashboard();\n            const selector = document.getElementById('lesson-selector');\n            lessonsData.forEach((l, i) => {\n                const opt = document.createElement('option'); opt.value = i; opt.innerText = l.name;\n                selector.appendChild(opt);\n            });\n        };\n\n        let filteredIndexes = []; // Lưu danh sách các bài đang hiển thị\n\n        function getLessonPart(lesson) {\n            // Tự động quét số câu hỏi đầu tiên để biết bài này thuộc Part mấy\n            const match = lesson.processedQuestions.match(/(?:class=\"q-badge\"|class=\"[^\"]*bg-blue-100[^\"]*\")[^>]*>(\\d+)</);\n            if (match) {\n                const num = parseInt(match[1]);\n                if (num <= 10) return \"PART1\";\n                if (num <= 20) return \"PART2\";\n                if (num <= 30) return \"PART3\";\n                if (num <= 40) return \"PART4\";\n            }\n            return \"ALL\"; // Mặc định nếu không phân tách được\n        }\n\n        function renderDashboard() {\n            // Đánh dấu Part cho từng bài nếu chưa có\n            lessonsData.forEach(l => {\n                if(!l.part) l.part = getLessonPart(l);\n            });\n\n            // Lắng nghe sự kiện click chọn Part\n            document.querySelectorAll('input[name=\"lesson_filter\"]').forEach(radio => {\n                radio.addEventListener('change', updateFilteredCards);\n            });\n\n            updateFilteredCards();\n            document.body.classList.add('in-dashboard');\n        }\n\n        function updateFilteredCards() {\n            const filterVal = document.querySelector('input[name=\"lesson_filter\"]:checked').value;\n            const cardArea = document.getElementById('card-render-area');\n            const selectBox = document.getElementById('specific-lesson-select');\n            \n            let cardsHtml = '';\n            let optionsHtml = '<option value=\"\">🗂️ Chọn bài nghe cụ thể...</option>';\n            filteredIndexes = [];\n\n            lessonsData.forEach((d, i) => {\n                // Hiển thị nếu chọn 'Full Test' hoặc đúng Part đang chọn\n                if (filterVal === 'ALL' || d.part === filterVal) {\n                    filteredIndexes.push(i);\n                    let totalQs = d.totalQs || 0;\n                    \n                    let tagsHtml = `<div class=\"q-tag\">Listening Task <span class=\"q-tag-count\">${totalQs}</span></div>`;\n                    if (d.lastResult) {\n                        tagsHtml += `<div class=\"q-tag\" style=\"background:#f0fdf4; color:#16a34a; border-color:#bbf7d0;\">Kết quả: <span class=\"q-tag-count\" style=\"background:#16a34a; color:white;\">${d.lastResult}</span></div>`;\n                    }\n\n                    \n\n                    optionsHtml += `<option value=\"${i}\">${d.name || 'Untitled'}</option>`;\n                }\n            });\n            \n            cardArea.innerHTML = cardsHtml;\n            selectBox.innerHTML = optionsHtml;\n            \n            // Ẩn/hiện khu vực Card (nếu muốn bảng điều khiển gọn gàng)\n            cardArea.style.display = 'none'; // Luôn ẩn danh sách card theo yêu cầu\n\t\t\t// Đổi text và sự kiện của nút bắt đầu tùy theo chế độ\n            const mainBtn = document.querySelector('.random-btn');\n            if (mainBtn) {\n                if (filterVal === 'ALL') {\n                    mainBtn.innerHTML = '<i class=\"fa-solid fa-play\"></i> LÀM NGUYÊN BÀI (TUẦN TỰ)';\n                    mainBtn.onclick = startSequentialTest;\n                } else {\n                    mainBtn.innerHTML = '<i class=\"fa-solid fa-shuffle\"></i> NGẪU NHIÊN 1 BÀI';\n                    mainBtn.onclick = startRandomTest;\n                }\n            }\n        }\n\n        window.startRandomTest = () => {\n            if (filteredIndexes.length === 0) {\n                alert(\"Hiện tại trong dữ liệu chưa có bài nào thuộc Part này nhé!\");\n                return;\n            }\n            if (filteredIndexes.length === 1) {\n                startTest(filteredIndexes[0]);\n                return;\n            }\n            \n            let randomIndex;\n            // Bốc ngẫu nhiên nhưng đảm bảo không trùng với bài hiện tại đang mở\n            do {\n                randomIndex = filteredIndexes[Math.floor(Math.random() * filteredIndexes.length)];\n            } while (randomIndex === currentLessonIndex && !document.body.classList.contains('in-dashboard'));\n            \n            startTest(randomIndex);\n        };\n\n        // Lắng nghe sự kiện nhấn phím mũi tên phải (ArrowRight)\n        document.addEventListener('keydown', function(e) {\n            if (e.key === 'ArrowRight') {\n                // Bỏ qua nếu học sinh đang gõ chữ vào ô điền từ (tránh nhảy bài nhầm)\n                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;\n                \n                // Chỉ kích hoạt nhảy bài khi đang ở trong màn hình làm bài và có nhiều hơn 1 bài để nhảy\n                if (!document.body.classList.contains('in-dashboard') && filteredIndexes.length > 1) {\n                    goToNextLesson();\n                }\n            }\n        });\n\n        window.startTest = (idx) => {\n            // 1. Loại bỏ class ẩn giao diện chính\n            document.body.classList.remove('in-dashboard');\n            // 2. Ẩn hẳn Dashboard view để không che bài tập\n            document.getElementById('dashboard-view').style.display = 'none';\n            // 3. Chuyển bài và render\n            document.getElementById('lesson-selector').value = idx;\n            switchLesson(idx);\n        };\n\n        window.goBackToDashboard = () => {\n            if(confirm(\"Bạn có muốn quay lại danh sách bài tập? (Tiến độ và kết quả sẽ được lưu tạm)\")) {\n                saveCurrentStateToMemory(); // Chụp ảnh trạng thái trước khi thoát\n                \n                // 1. Hiện lại Dashboard view\n                document.getElementById('dashboard-view').style.display = 'flex';\n                // 2. Thêm class để ẩn giao diện làm bài\n                document.body.classList.add('in-dashboard');\n                \n                // Dừng các hoạt động của bài thi\n                if(window.timerInterval) clearInterval(window.timerInterval);\n                const audio = document.getElementById('audio');\n                if(audio) audio.pause();\n                \n                // Vẽ lại Dashboard để hiển thị điểm vừa lưu\n                renderDashboard();\n            }\n        };\n\t\t\n\t\t// --- LOGIC QUESTION PALETTE & BOTTOM ACTIONS ---\nfunction buildPalette(lesson) {\n    const pal = document.getElementById('question-palette');\n    pal.innerHTML = '';\n    const key = lesson.answerKey;\n    if (!key || Object.keys(key).length === 0) return;\n    \n    let fallbackCounter = 1;\n    \n    for (const id in key) {\n        let qLabel = \"\";\n        const el = document.getElementById(id);\n        \n        if (el) {\n            // Dạng 1: Trắc nghiệm (Radio/Checkbox)\n            if (el.classList.contains('question-block')) {\n                const badge = el.querySelector('.q-badge, .bg-blue-100');\n                if (badge) qLabel = badge.innerText.trim();\n            } \n            // Dạng 2: Điền từ (Gap-fill) hoặc Kéo thả (Drop-zone)\n            else if (el.tagName === 'INPUT' || el.classList.contains('drop-zone')) {\n                const prev = el.previousElementSibling;\n                if (prev && prev.tagName === 'SPAN') {\n                    qLabel = prev.innerText.trim();\n                } else {\n                    // Nếu nằm trong bảng, thử tìm nhãn xung quanh ô đó\n                    const parent = el.parentElement;\n                    if (parent) {\n                        const badge = parent.querySelector('.q-badge, .bg-blue-100');\n                        if (badge) qLabel = badge.innerText.trim();\n                    }\n                }\n            }\n        } else {\n            // Dạng 3: Map Grid (Không có thẻ ID trực tiếp, phải quét qua Name của thẻ Radio)\n            const inputs = document.getElementsByName(id);\n            if (inputs.length > 0) {\n                const tr = inputs[0].closest('tr');\n                if (tr) {\n                    const firstTd = tr.querySelector('td');\n                    if (firstTd) {\n                        const match = firstTd.innerText.match(/^\\d+/);\n                        if (match) qLabel = match[0];\n                    }\n                }\n            }\n        }\n\n        // Nếu câu nào đề bài không ghi số, dùng biến đếm dự phòng nối tiếp\n        if (!qLabel || qLabel === '#') {\n            qLabel = fallbackCounter;\n        } else {\n            // Cập nhật lại bộ đếm cho khớp với số hiện tại\n            const parsedNum = parseInt(qLabel);\n            if (!isNaN(parsedNum)) fallbackCounter = parsedNum;\n        }\n        fallbackCounter++;\n\n        // Render nút bấm\n        const btn = document.createElement('button');\n        btn.className = 'palette-btn';\n        btn.innerText = qLabel;\n        btn.dataset.targetId = id;\n        btn.onclick = () => scrollToQuestion(id);\n        pal.appendChild(btn);\n    }\n    updatePaletteState();\n}\n\n\t\tfunction updatePaletteState() {\n            document.querySelectorAll('.palette-btn').forEach(btn => {\n                const id = btn.dataset.targetId;\n                let answered = false; let isCorrect = false; let isIncorrect = false;\n                \n                const el = document.getElementById(id);\n                if(el) {\n                    if(el.tagName === 'INPUT') {\n                        answered = el.value.trim() !== '';\n                    } \n                    else if(el.classList.contains('drop-zone')) {\n                        answered = (el.dataset.value || '').trim() !== '';\n                    } \n                    else if (el.classList.contains('question-block')) {\n                        // Nhận diện xuyên thấu vào các câu Multiple Choice (Radio/Checkbox)\n                        const inputs = el.querySelectorAll('input[type=\"radio\"], input[type=\"checkbox\"]');\n                        if (inputs.length > 0) {\n                            for(let i of inputs) {\n                                if(i.checked) answered = true;\n                                const target = i.parentElement;\n                                if(target.classList.contains('correct-text') || target.classList.contains('correct-answer')) isCorrect = true;\n                                if(target.classList.contains('incorrect-answer')) isIncorrect = true;\n                            }\n                        }\n                    }\n                    \n                    // Quét đúng sai cho dạng text/drop-zone\n                    if(el.classList.contains('correct-answer')) isCorrect = true;\n                    if(el.classList.contains('incorrect-answer')) isIncorrect = true;\n                } else {\n                    // Nhận diện cho Map Grid\n                    const inputs = document.getElementsByName(id);\n                    if(inputs.length) {\n                        for(let i of inputs) {\n                            if(i.checked) answered = true;\n                            const target = i.closest('td') || i.parentElement;\n                            if(target.classList.contains('correct-text') || target.classList.contains('correct-answer')) isCorrect = true;\n                            if(target.classList.contains('incorrect-answer')) isIncorrect = true;\n                        }\n                    }\n                }\n                \n                btn.className = 'palette-btn'; // Reset\n                if (isIncorrect) btn.classList.add('incorrect');\n                else if (isCorrect) btn.classList.add('correct');\n                else if (answered) btn.classList.add('answered');\n            });\n        }\n\nfunction scrollToQuestion(id) {\n    let el = document.getElementById(id);\n    if(!el) {\n        const inputs = document.getElementsByName(id);\n        if(inputs.length) el = inputs[0].closest('.question-block') || inputs[0].closest('tr');\n    }\n    if(el) {\n        el.scrollIntoView({behavior: 'smooth', block: 'center'});\n        el.classList.remove('blink-effect');\n        void el.offsetWidth; // Trigger reflow\n        el.classList.add('blink-effect');\n    }\n}\n\n// Lắng nghe sự kiện gõ phím/chọn đáp án để tô màu xanh da trời\ndocument.addEventListener('input', (e) => { if(e.target.closest('#questions-content')) updatePaletteState(); });\ndocument.addEventListener('change', (e) => { if(e.target.closest('#questions-content')) updatePaletteState(); });\n\n\t\tlet currentTestSequence = []; \n        let usedLessons = []; // Biến mới: Ghi nhớ các bài đã từng làm trong phiên này\n\n        window.startSequentialTest = () => {\n            // Lọc ra danh sách các bài CHƯA từng được bốc\n            let availableLessons = lessonsData.map((l, i) => !usedLessons.includes(i) ? i : -1).filter(i => i !== -1);\n\n            // Phân nhóm các bài còn trống theo Part\n            const p1 = availableLessons.filter(i => lessonsData[i].part === 'PART1');\n            const p2 = availableLessons.filter(i => lessonsData[i].part === 'PART2');\n            const p3 = availableLessons.filter(i => lessonsData[i].part === 'PART3');\n            const p4 = availableLessons.filter(i => lessonsData[i].part === 'PART4');\n\n            // Nếu 1 trong 4 Part đã bị xài hết bài, tiến hành reset bộ nhớ\n            if (!p1.length || !p2.length || !p3.length || !p4.length) {\n                alert(\"Hoan hô! Bạn đã giải hết các tổ hợp đề không trùng lặp. Hệ thống sẽ trộn lại từ đầu nhé!\");\n                usedLessons = []; // Xóa trí nhớ\n                return startSequentialTest(); // Tự động bốc lại vòng mới\n            }\n\n            // Thuật toán: Bốc ngẫu nhiên đúng 1 bài từ các bài CHƯA LÀM\n            currentTestSequence = [\n                p1[Math.floor(Math.random() * p1.length)],\n                p2[Math.floor(Math.random() * p2.length)],\n                p3[Math.floor(Math.random() * p3.length)],\n                p4[Math.floor(Math.random() * p4.length)]\n            ];\n\n            // Lưu 4 bài vừa bốc vào sổ tay \"Đã làm\"\n            usedLessons.push(...currentTestSequence);\n\n            // Làm sạch mọi lịch sử làm bài trước đó trong cả ngân hàng đề\n            lessonsData.forEach(l => {\n                delete l.lastResult; delete l.scoreInfo; delete l.timeTaken; \n                delete l.dateCompleted; delete l.submitAttempt; delete l.savedDOM;\n            });\n\n            // Ra lệnh bắt đầu bài thi\n            startTest(currentTestSequence[0]);\n        };\n\n        window.goToNextLesson = () => {\n            const filterVal = document.querySelector('input[name=\"lesson_filter\"]:checked').value;\n            if (filterVal === 'ALL') {\n                // Di chuyển sang Part tiếp theo trong bộ 4 bài đã bốc\n                let currentIndex = currentTestSequence.indexOf(currentLessonIndex);\n                if (currentIndex >= 0 && currentIndex < currentTestSequence.length - 1) {\n                    startTest(currentTestSequence[currentIndex + 1]);\n                } else {\n\t\t\t\t\n\t\t\t\t// --- THÊM CODE GỬI BÁO CÁO FULL TEST ---\n                    let totalCorrect = 0, totalQs = 0, totalTime = 0;\n                    currentTestSequence.forEach(idx => {\n                        const l = lessonsData[idx];\n                        if (l.scoreInfo) {\n                            totalCorrect += l.scoreInfo.correct;\n                            totalQs += l.scoreInfo.total;\n                            let t = (l.timeTaken || \"00:00\").split(':');\n                            totalTime += parseInt(t[0]) * 60 + parseInt(t[1]);\n                        }\n                    });\n                    sendReportToSheet(totalCorrect, totalQs, totalTime, \"Full Test (4 Parts)\");\n                    // ---------------------------------------\n\t\t\t\t\t\n                    openReport(); // Hoàn thành 4 Parts thì tự động bung Report\n                }\n            } else {\n                startRandomTest(); // Chế độ luyện tập ngẫu nhiên\n            }\n        };\n\nwindow.saveCurrentResult = () => {\n    saveCurrentStateToMemory();\n    const clone = document.documentElement.cloneNode(true);\n    \n    // Dọn dẹp giao diện trước khi xuất file tĩnh\n    ['#dashboard-view', '.back-btn', '#bottom-actions'].forEach(sel => {\n        const el = clone.querySelector(sel);\n        if(el) el.remove();\n    });\n    clone.querySelectorAll('script').forEach(s => s.remove());\n    clone.querySelector('button[onclick=\"checkResults()\"]').remove();\n    \n    const html = \"<!DOCTYPE html>\\n\" + clone.outerHTML;\n    const blob = new Blob([html], {type: \"text/html;charset=utf-8\"});\n    const a = document.createElement(\"a\");\n    a.href = URL.createObjectURL(blob);\n    a.download = `Result_${lessonsData[currentLessonIndex].name}.html`;\n    a.click();\n};\n\n// --- LOGIC BÁO CÁO (REPORT) ---\n        let isFromReport = false;\n\n        function detectTypes(lesson) {\n            let types = new Set();\n            if (lesson.processedQuestions.includes('type=\"radio\"') || lesson.processedQuestions.includes('type=\"checkbox\"')) types.add('Multiple Choice');\n            if (lesson.processedQuestions.includes('type=\"text\"')) types.add('Gap Fill');\n            if (lesson.processedQuestions.includes('drop-zone')) types.add('Matching/Map');\n            return Array.from(types).join(', ') || 'Mixed';\n        }\n\n        function getBandScore(correct, total) {\n            if(total === 0) return \"0.0\";\n            let scaled = Math.round((correct / total) * 40); // Đưa về hệ số 40 câu IELTS chuẩn\n            if (scaled >= 39) return \"9.0\"; if (scaled >= 37) return \"8.5\";\n            if (scaled >= 35) return \"8.0\"; if (scaled >= 32) return \"7.5\";\n            if (scaled >= 30) return \"7.0\"; if (scaled >= 26) return \"6.5\";\n            if (scaled >= 23) return \"6.0\"; if (scaled >= 18) return \"5.5\";\n            if (scaled >= 16) return \"5.0\"; if (scaled >= 13) return \"4.5\";\n            if (scaled >= 10) return \"4.0\"; if (scaled >= 8) return \"3.5\";\n            if (scaled >= 6) return \"3.0\"; if (scaled >= 4) return \"2.5\";\n            return \"0.0\"; \n        }\n\n        function openReport() {\n            document.body.classList.add('in-dashboard');\n            document.getElementById('dashboard-view').style.display = 'none';\n            document.getElementById('report-view').style.display = 'flex';\n            renderReportData();\n        }\n\n        function closeReport() {\n            document.getElementById('report-view').style.display = 'none';\n            document.getElementById('dashboard-view').style.display = 'flex';\n        }\n\n        function viewFromReport(idx) {\n            isFromReport = true;\n            document.getElementById('report-view').style.display = 'none';\n            \n            // Xử lý nút Back\n            document.getElementById('btn-back-report').classList.remove('hidden');\n            document.querySelector('.back-btn:not(#btn-back-report)').classList.add('hidden');\n            \n            startTest(idx);\n        }\n\n        function backToReport() {\n            isFromReport = false;\n            saveCurrentStateToMemory(); // Lưu tạm nếu học sinh đang xem dở\n            \n            // Đổi lại nút Back\n            document.getElementById('btn-back-report').classList.add('hidden');\n            document.querySelector('.back-btn:not(#btn-back-report)').classList.remove('hidden');\n            \n            // Dừng Audio\n            if(window.timerInterval) clearInterval(window.timerInterval);\n            const audio = document.getElementById('audio');\n            if(audio) audio.pause();\n            \n            openReport();\n        }\n\n        function renderReportData() {\n            let partAcc = { 'PART1': {c:0, t:0}, 'PART2': {c:0, t:0}, 'PART3': {c:0, t:0}, 'PART4': {c:0, t:0}, 'ALL': {c:0, t:0} };\n            let totalCorrect = 0, totalQs = 0, completedCount = 0;\n            let historyRows = '';\n\n            const filterVal = document.querySelector('input[name=\"lesson_filter\"]:checked').value;\n            \n            // LOGIC QUAN TRỌNG: Tách riêng danh sách bài sẽ được đưa vào tính điểm Report\n            let reportList = [];\n            if (filterVal === 'ALL' && currentTestSequence && currentTestSequence.length === 4) {\n                // Nếu đang làm Full Test, CHỈ bốc đúng 4 Parts đã được random để tính điểm\n                reportList = currentTestSequence.map(idx => ({ l: lessonsData[idx], idx: idx }));\n            } else {\n                // Nếu đang luyện tập Part lẻ tẻ ngẫu nhiên, quét tất cả bài đã có kết quả\n                reportList = lessonsData.map((l, idx) => ({ l: l, idx: idx }));\n            }\n\n            reportList.forEach(item => {\n                const l = item.l;\n                const idx = item.idx;\n\n                if(l.lastResult && l.scoreInfo) {\n                    completedCount++;\n                    totalCorrect += l.scoreInfo.correct;\n                    totalQs += l.scoreInfo.total;\n                    \n                    let p = l.part || 'ALL';\n                    if(partAcc[p]) {\n                        partAcc[p].c += l.scoreInfo.correct;\n                        partAcc[p].t += l.scoreInfo.total;\n                    }\n                    \n                    let types = detectTypes(l);\n                    let timeStr = l.timeTaken || '00:00';\n                    let dateStr = l.dateCompleted || '-';\n                    \n                    let percent = Math.round((l.scoreInfo.correct/l.scoreInfo.total)*100);\n                    \n                    historyRows += `<tr>\n                        <td class=\"font-medium\">${l.name.substring(0,25)}${l.name.length>25?'...':''}</td>\n                        <td>${types}</td>\n                        <td>${l.scoreInfo.correct}/${l.scoreInfo.total} <span class=\"text-gray-400\">(${percent}%)</span></td>\n                        <td>${timeStr}</td>\n                        <td>${dateStr}</td>\n                        <td class=\"text-right\"><a class=\"btn-detail\" onclick=\"viewFromReport(${idx})\">Xem chi tiết →</a></td>\n                    </tr>`;\n                }\n            });\n\n            // Gắn số liệu tổng quan lên giao diện Report\n            document.getElementById('rp-total-lessons').innerText = completedCount;\n            document.getElementById('rp-correct').innerText = `${totalCorrect} / ${totalQs}`;\n            \n            // Xử lý Band điểm: Chỉ tính và hiện Band điểm IELTS khi học sinh làm Full Test\n            if (filterVal === 'ALL') {\n                document.getElementById('rp-band').innerText = getBandScore(totalCorrect, totalQs);\n                document.getElementById('rp-band').classList.remove('text-gray-400');\n                document.getElementById('rp-band').classList.add('text-orange-600');\n            } else {\n                document.getElementById('rp-band').innerText = \"---\";\n                document.getElementById('rp-band').classList.remove('text-orange-600');\n                document.getElementById('rp-band').classList.add('text-gray-400');\n            }\n\n            document.getElementById('rp-history-count').innerText = completedCount;\n            document.getElementById('rp-history-body').innerHTML = historyRows || '<tr><td colspan=\"6\" class=\"text-center py-4\">Chưa có dữ liệu làm bài.</td></tr>';\n\n            // Vẽ Progress Bars thể hiện độ chính xác theo Parts\n            let barsHTML = '';\n            for(let key in partAcc) {\n                if(partAcc[key].t > 0) {\n                    let acc = Math.round((partAcc[key].c / partAcc[key].t) * 100);\n                    let partName = key === 'ALL' ? 'Full Test / Mixed' : key.replace('PART', 'Part ');\n                    barsHTML += `\n                        <div class=\"progress-row\">\n                            <div class=\"progress-label\">${partName}</div>\n                            <div class=\"progress-bar-bg\">\n                                <div class=\"progress-bar-fill\" style=\"width: ${acc}%\"></div>\n                            </div>\n                        </div>`;\n                }\n            }\n            document.getElementById('rp-accuracy-bars').innerHTML = barsHTML || '<div class=\"text-sm text-gray-500 italic\">Chưa đủ dữ liệu để thống kê theo part.</div>';\n        }\n    <\/script>\n</body>\n</html>\n    "}];

    function buildSidebarTree(nodes, containerEl, isRoot = false) {
      const ul = document.createElement('ul');
      if (isRoot) ul.className = 'root';

      nodes.forEach(node => {
        const li = document.createElement('li');
        
        if (node.type === 'folder') {
          const titleDiv = document.createElement('div');
          titleDiv.className = 'folder-title collapsed';
          titleDiv.innerHTML = `<span class="folder-icon"></span> ${node.name}`;
          
          const childrenDiv = document.createElement('div');
          childrenDiv.className = 'folder-children collapsed';
          buildSidebarTree(node.children, childrenDiv);
          
          titleDiv.onclick = () => {
            childrenDiv.classList.toggle('collapsed');
            titleDiv.classList.toggle('collapsed');
          };
          
          li.appendChild(titleDiv);
          li.appendChild(childrenDiv);
        } else {
          const titleDiv = document.createElement('div');
          titleDiv.className = 'file-title';
          titleDiv.innerHTML = `📄 ${node.name}`;
          titleDiv.id = 'file_' + node.id;
          
          titleDiv.onclick = () => {
            document.querySelectorAll('.file-title').forEach(el => el.classList.remove('active'));
            titleDiv.classList.add('active');
            
            // TÌM FILE GỐC TỪ DATABASE ẢO
            const tpl = templatesData.find(t => t.id === node.templateId);
            frame.srcdoc = tpl ? tpl.content : '<p style="color:red; padding:20px;">Lỗi: Không tìm thấy dữ liệu file mẫu. File có thể đã bị xóa khỏi kho lưu trữ.</p>';
            
            currentTitle.textContent = node.name;
            
            if (window.innerWidth <= 768) {
              sidebar.classList.remove('open');
            }
          };
          
          li.appendChild(titleDiv);
        }
        
        ul.appendChild(li);
      });
      containerEl.appendChild(ul);
    }

    buildSidebarTree(treeData, treeContainer, true);
