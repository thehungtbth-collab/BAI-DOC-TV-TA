<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hệ thống Bài tập</title>
  <style>
    :root{--bg:#f8fafc;--card:#fff;--accent1:#6a11cb;--accent2:#2575fc;--muted:#6b7280;--border:#e2e8f0}
    html, body { height: 100%; margin: 0; font-family:Inter,system-ui,Arial; background:var(--bg); color:#0f172a; overflow:hidden;}
    
    .layout { display: flex; height: 100vh; width: 100vw; }
    
    .main-content { flex: 1; display:flex; flex-direction:column; background: #fff; position: relative; min-width:0;}
    .toolbar { height: 50px; background: #fff; border-bottom: 1px solid var(--border); display:flex; align-items:center; padding: 0 20px; font-weight:bold; color: #475569; justify-content: space-between;}
    #frame { flex: 1; width: 100%; border: none; background: #fff; }
    
    .sidebar { 
      width: 320px; background: var(--card); border-left: 1px solid var(--border); display:flex; flex-direction:column; overflow-y:auto; padding:15px; box-shadow: -2px 0 8px rgba(0,0,0,0.03); z-index:10; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), padding 0.3s ease, border 0.3s ease; flex-shrink: 0;
    }
    .sidebar h2 { margin-top:0; font-size:17px; color:var(--accent2); padding-bottom:12px; border-bottom:1px solid var(--border); }
    .sidebar.collapsed { width: 0; padding: 0; border-left: none; overflow: hidden; }

    .toggle-btn { background: linear-gradient(90deg, var(--accent1), var(--accent2)); color: white; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 10px rgba(37,117,252,0.15); user-select: none; }
    .toggle-btn:hover { opacity: 0.9; }
    
    ul { list-style: none; padding-left: 15px; margin: 0; }
    ul.root { padding-left: 0; }
    li { margin: 6px 0; }
    .folder-title, .file-title { padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 14px; user-select: none; transition: background 0.15s; }
    .folder-title { font-weight: 600; color: #334155; }
    .folder-title:hover { background: #f1f5f9; }
    .file-title { color: #475569; display: flex; align-items: center; gap: 6px;}
    .file-title:hover { background: #e0e7ff; color: #3730a3; }
    .file-title.active { background: var(--accent2); color: #fff; font-weight:bold; }
    
    .folder-children { display: block; }
    .folder-children.collapsed { display: none; }
    .folder-icon::before { content: '📂 '; }
    .folder-title.collapsed .folder-icon::before { content: '📁 '; }

    @media (max-width:768px){ 
      .sidebar { position: absolute; right: -320px; left: auto; height: 100%; transition: right 0.3s ease; width: 320px; }
      .sidebar.open { right: 0; width: 320px; padding: 15px; border-left: 1px solid var(--border); }
      .sidebar.collapsed { right: -320px; }
    }
  </style>
</head>

    </div>
    
    <div class="sidebar" id="sidebar">

 border-bottom-color: #3b82f6; background: #eff6ff; }\n        \n        /* Hiệu ứng Alert và Sparkle */\n        input[type=\"text\"].highlight-input { background-color: #fef9c3; border-bottom-color: #eab308; transform: scale(1.05); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }\n        .question-block { transition: all 0.3s; }\n        .question-block.highlight-block { border-left: 4px solid #ef4444; background: #fef2f2; padding-left: 12px; }\n\n        /* Table Styles */\n        .generated-table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 0.9em; }\n        .generated-table td, .generated-table th { border: 1px solid #e2e8f0; padding: 8px; vertical-align: middle; }\n        .generated-table tr:nth-child(even) { background-color: #f8fafc; }\n        .generated-table tr:hover { background-color: #f1f5f9; }\n        .generated-table td input { width: 90%; min-width: 40px; }\n\n        .draggable-item { cursor: grab; background: white; border: 1px solid #cbd5e1; padding: 6px 10px; border-radius: 4px; display: inline-block; margin: 4px; font-size: 0.9em; box-shadow: 0 1px 2px rgba(0,0,0,0.05); user-select: none; transition: all 0.2s; max-width: 100%; word-break: break-word; white-space: normal; line-height: 1.4; text-align: left; }\n        .draggable-item:active { cursor: grabbing; border-color: #3b82f6; }\n        .draggable-item.used { opacity: 0.4; background: #e2e8f0; text-decoration: line-through; pointer-events: none; border-color: #cbd5e1; box-shadow: none; }\n        \n        .drop-zone { display: inline-flex; align-items: center; justify-content: flex-start; min-width: 80px; min-height: 32px; border: 2px dashed #cbd5e1; border-radius: 4px; background: #f8fafc; vertical-align: middle; margin: 0; text-align: left; line-height: 1.4; position: relative; transition: all 0.2s; max-width: 100%; padding: 4px 8px; box-sizing: border-box; overflow: hidden; }\n        .drop-zone.drag-over { background: #eff6ff; border-color: #3b82f6; transform: scale(1.02); }\n        .drop-zone.cursor-pointer:hover { border-color: #94a3b8; background: #f1f5f9; }\n        .drop-zone .dropped-item { background: #dbeafe; color: #1e40af; padding: 4px 8px; border-radius: 2px; display: block; width: 100%; font-weight: bold; pointer-events: none; word-break: break-word; white-space: normal; text-align: left; font-size: 0.9em; margin: 0; }\n        \n\t\t/* Grading Styles */\n        .correct-answer { background-color: #dcfce7 !important; border-color: #22c55e !important; color: #15803d !important; }\n        .incorrect-answer { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c !important; }\n        .correct-text { color: #15803d; font-weight: bold; }\n        .correct-feedback { display: block; margin-top: 4px; color: #16a34a; font-weight: bold; font-size: 0.875rem; animation: fadeIn 0.5s; }\n        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }\n        \n        .resizer-bar { width: 8px; background-color: #cbd5e1; cursor: col-resize; flex-shrink: 0; z-index: 30; display: flex; justify-content: center; align-items: center; border-left: 1px solid #94a3b8; }\n        .resizer-bar::after { content: \"||\"; color: #475569; font-size: 10px; }\n\t\t\n\t\t/* --- GIAO DIỆN DASHBOARD CARD --- */\n        #dashboard-view { position: fixed; inset: 0; background: #f4f7f6; z-index: 1000; overflow-y: auto; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }\n        .dash-title { font-size: 24px; font-weight: 800; color: #0f766e; margin-bottom: 30px; text-transform: uppercase; }\n        .card-container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; max-width: 1200px; width: 100%; }\n        .test-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; width: 340px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: transform 0.2s; display: flex; flex-direction: column; }\n        .test-card:hover { transform: translateY(-3px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }\n        .card-header { display: flex; align-items: flex-start; gap: 10px; color: #115e59; font-weight: 700; font-size: 16px; margin-bottom: 12px; text-transform: uppercase; line-height: 1.4; }\n        .q-types-box { background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px; padding: 10px; margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 6px; flex: 1; align-content: flex-start; }\n        .q-tag { background: #fff; border: 1px solid #e2e8f0; color: #475569; font-size: 11px; padding: 4px 8px; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.02); display: flex; align-items: center; gap: 4px; font-weight: 600; }\n        .q-tag-count { background: #e0f2fe; color: #0369a1; padding: 2px 6px; border-radius: 10px; font-size: 10px; font-weight: 700; }\n        .card-stats { background: #fff1f2; border-radius: 8px; padding: 12px 16px; display: flex; justify-content: space-between; margin-bottom: 20px; }\n        .stat-item { display: flex; align-items: center; gap: 6px; color: #9a3412; font-size: 13px; font-weight: 600; }\n        .btn-enter { background: #e0f2fe; color: #0369a1; padding: 10px 0; width: 100%; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid #bae6fd; transition: 0.2s; text-align: center; }\n        .btn-enter:hover { background: #bae6fd; }\n        \n        /* Ẩn giao diện chính khi ở sảnh chờ */\n        body.in-dashboard > header, body.in-dashboard > main { display: none !important; }\n        \n        /* Nút quay lại */\n        .back-btn { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 13px; transition: 0.2s; margin-right: 16px; }\n        .back-btn:hover { background: #e2e8f0; color: #1e293b; }\n\t\t\n\t\t/* User Highlight & Note Styles */\n        .user-hl { cursor: pointer; border-radius: 2px; transition: opacity 0.2s; }\n        .user-hl:hover { opacity: 0.7; }\n        .user-note { \n            border-bottom: 2px dashed #f59e0b; \n            background-color: rgba(245, 158, 11, 0.1); \n            cursor: pointer; \n            position: relative; \n            transition: all 0.2s;\n        }\n        .user-note:hover { background-color: rgba(245, 158, 11, 0.3); }\n        .user-note::after {\n            content: '\\f249'; /* FontAwesome sticky-note icon */\n            font-family: \"Font Awesome 6 Free\";\n            font-weight: 900;\n            font-size: 10px;\n            color: #d97706;\n            vertical-align: super;\n            margin-left: 2px;\n        }\n        #floating-note-btn { \n            position: absolute; z-index: 1000; \n            background: #1e293b; color: white; \n            padding: 5px 12px; border-radius: 6px; \n            font-size: 13px; font-weight: bold; \n            cursor: pointer; display: none; \n            box-shadow: 0 4px 6px rgba(0,0,0,0.2); \n        }\n        #floating-note-btn:hover { background: #3b82f6; }\n\t\t\n/* Style số câu hỏi giống hệt gap-fill */\n        .q-badge {\n            background-color: #dbeafe; /* bg-blue-100 */\n            color: #1d4ed8; /* text-blue-700 */\n            padding: 2px 6px; /* px-1.5 py-0.5 */\n            border-radius: 4px; /* rounded */\n            font-size: 11px; /* text-[11px] */\n            font-weight: 700; /* font-bold */\n            border: 1px solid #bfdbfe; /* border-blue-200 */\n            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); /* shadow-sm */\n            display: inline-block;\n            vertical-align: middle;\n            margin-right: 6px;\n        }\n\n        /* MCQ Option: Chữ cái nằm trong nút tròn */\n        .mcq-option {\n            display: flex;\n            align-items: center;\n            padding: 8px 12px;\n            margin-bottom: 5px;\n            border: 1px solid #e2e8f0;\n            border-radius: 8px;\n            cursor: pointer;\n            transition: all 0.2s;\n            background: #fff;\n        }\n        .mcq-option:hover { background-color: #f8fafc; border-color: #cbd5e1; }\n        .mcq-option input { display: none; } /* Ẩn nút radio/checkbox gốc */\n\n        .opt-letter {\n            width: 26px;\n            height: 26px;\n            display: flex;\n            align-items: center;\n            justify-content: center;\n            border-radius: 50%;\n            border: 2px solid #cbd5e1;\n            background-color: #f8fafc;\n            color: #64748b;\n            font-weight: bold;\n            font-size: 12px;\n            margin-right: 10px;\n            flex-shrink: 0;\n            transition: all 0.2s;\n        }\n\n        /* Khi được chọn */\n        .mcq-option input:checked + .opt-letter {\n            background-color: #2563eb;\n            border-color: #2563eb;\n            color: white;\n        }\n        .mcq-option:has(input:checked) {\n            background-color: #eff6ff;\n            border-color: #3b82f6;\n        }\n\t\t\n\t\t/* CSS cho Map Grid */\n        .map-grid-table { width: 100%; border-collapse: collapse; margin: 16px 0; table-layout: auto; }\n        .map-grid-table th, .map-grid-table td { border: 1px solid #cbd5e1; padding: 6px; text-align: center; vertical-align: middle; }\n        .map-radio { width: 18px; height: 18px; cursor: pointer; accent-color: #2563eb; }\n        td.correct-text { background-color: #dcfce7 !important; border-color: #22c55e !important; }\n        td.incorrect-answer { background-color: #fee2e2 !important; border-color: #ef4444 !important; }\n\t\t\n\t\t/* Question Palette trên Header */\n\t\t#question-palette::-webkit-scrollbar { display: none; }\n\t\t.palette-btn { width: 28px; height: 28px; flex-shrink: 0; border-radius: 6px; border: 1px solid #cbd5e1; background: white; color: #475569; font-size: 1 px 6px rgba(0,0,0,0.05); margin-bottom: 24px; flex-shrink: 0; }\n        .filter-header { color: #0f766e; font-size: 16px; font-weight: 800; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; text-transform: uppercase; }\n        .filter-option { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; cursor: pointer; color: #475569; font-size: 14px; font-weight: 500; }\n        .filter-option input[type=\"radio\"] { width: 16px; height: 16px; accent-color: #2563eb; cursor: pointer; }\n        .random-btn { width: 100%; background: #3b82f6; color: white; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: bold; margin-top: 10px; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; border: none; }\n        .random-btn:hover { background: #2563eb; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); transform: translateY(-1px); }\n        .select-lesson-box { margin-top: 15px; width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; color: #475569; font-size: 13px; font-weight: 600; outline: none; background: #f8fafc; cursor: pointer; }\n\t\t\n\t\t/* --- GIAO DIỆN REPORT --- */\n        #report-view { position: fixed; inset: 0; background: #f4f7f6; z-index: 1000; overflow-y: auto; padding: 40px 20px; display: none; flex-direction: column; align-items: center; font-family: 'Segoe UI', sans-serif;}\n        .report-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; width: 100%; max-width: 900px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }\n        .report-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid #e2e8f0; padding-bottom: 16px; }\n        .report-title { font-size: 20px; font-weight: 800; color: #1e293b; }\n        .report-close { background: #f1f5f9; color: #475569; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; border: 1px solid #cbd5e1; }\n        .report-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 30px; }\n        .report-stat-box { background: #fffbf5; padding: 16px; border-radius: 8px; border: 1px solid #faebd7; }\n        .report-stat-title { font-size: 13px; color: #64748b; margin-bottom: 8px; }\n        .report-stat-value { font-size: 24px; font-weight: 800; color: #1e293b; }\n        .progress-row { display: flex; align-items: center; margin-bottom: 16px; }\n        .progress-label { width: 150px; font-size: 13px; color: #475569; font-weight: 600; text-align: right; margin-right: 16px; }\n        .progress-bar-bg { flex: 1; background: #f1f5f9; height: 32px; position: relative; display: flex; align-items: center; }\n        .progress-bar-fill { height: 100%; background: #c2410c; transition: width 0.5s ease; }\n        .history-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }\n        .history-table th { text-align: left; padding: 12px 8px; border-bottom: 2px solid #e2e8f0; color: #64748b; font-weight: 600; text-transform: uppercase; font-size: 11px;}\n        .history-table td { padding: 12px 8px; border-bottom: 1px solid #e2e8f0; color: #334155; }\n        .btn-detail { color: #c2410c; font-weight: 600; cursor: pointer; text-decoration: none; }\n        .btn-detail:hover { text-decoration: underline; }\n\t\t\n\t\t/* Hiệu ứng Chuông báo chú ý */\n        .attention-bell {\n            color: #ef4444;\n            font-size: 12px;\n            font-weight: bold;\n            animation: shakeBell 0.4s ease-in-out infinite;\n            display: inline-flex;\n            align-items: center;\n            margin-left: 8px;\n            background: #fef2f2;\n            padding: 2px 6px;\n            border-radius: 4px;\n            border: 1px solid #fca5a5;\n            vertical-align: middle;\n            box-shadow: 0 2px 4px rgba(239, 68, 68, 0.2);\n            z-index: 10;\n        }\n        @keyframes shakeBell {\n            0%, 100% { transform: rotate(0deg); }\n            25% { transform: rotate(15deg); }\n            75% { transform: rotate(-15deg); }\n        }\n    </style>\n</head>\n<body class=\"bg-gray-100 h-screen flex flex-col text-gray-800 overflow-hidden\">\n\n<div id=\"login-modal\" style=\"position:fixed; inset:0; background:#f4f7f6; z-index:999999; display:flex; align-items:center; justify-content:center; font-family:'Segoe UI', sans-serif;\">\n    <div style=\"background:#fff; padding:40px; border-radius:12px; box-shadow:0 10px 25px rgba(0,0,0,0.1); width:320px; text-align:center;\">\n        <h2 style=\"color:#0f766e; margin-bottom:20px; text-transform:uppercase; font-weight:800;\">Đăng nhập làm bài</h2>\n        <input type=\"text\" id=\"hs-id\" placeholder=\"Nhập ID học sinh...\" style=\"width:100%; padding:10px; margin-bottom:15px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box; outline:none;\">\n        <input type=\"password\" id=\"hs-pass\" placeholder=\"Nhập mật khẩu...\" style=\"width:100%; padding:10px; margin-bottom:20px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box; outline:none;\">\n        <button onclick=\"handleLogin()\" id=\"btnLogin\" style=\"width:100%; padding:12px; background:#0ea5e9; color:#fff; border:none; border-radius:6px; font-weight:bold; cursor:pointer; transition:0.2s;\">ĐĂNG NHẬP</button>\n        <div id=\"login-msg\" style=\"color:#ef4444; margin-top:15px; font-size:13px; font-weight:bold;\"></div>\n    </div>\n</div>\n\n\t<div id=\"dashboard-view\">\n        <div class=\"dash-title\">DANH SÁCH BÀI NGHE</div>\n        \n        <div class=\"filter-panel\">\n            <div class=\"filter-header\"><i class=\"fa-regular fa-circle-dot text-red-500\"></i> LỌC DẠNG BÀI</div>\n            \n            <label class=\"filter-option\"><input type=\"radio\" name=\"lesson_filter\" value=\"ALL\" checked> Nghe Nguyên Bài (Full Test)</label>\n            <label class=\"filter-option\"><input type=\"radio\" name=\"lesson_filter\" value=\"PART1\"> Part 1 (Câu 1 - 10)</label>\n            <label class=\"filter-option\"><input type=\"radio\" name=\"lesson_filter\" value=\"PART2\"> Part 2 (Câu 11 - 20)</label>\n            <label class=\"filter-option\"><input type=\"radio\" name=\"lesson_filter\" value=\"PART3\"> Part 3 (Câu 21 - 30)</label>\n            <label class=\"filter-option\"><input type=\"radio\" name=\"lesson_filter\" value=\"PART4\"> Part 4 (Câu 31 - 40)</label>\n            \n            <button class=\"random-btn\" onclick=\"startRandomTest()\"><i class=\"fa-solid fa-shuffle\"></i> NGẪU NHIÊN 1 BÀI</button>\n            \n            <select id=\"specific-lesson-select\" class=\"select-lesson-box\" onchange=\"if(this.value !== '') startTest(this.value)\">\n                <option value=\"\">🗂️ Chọn bài nghe cụ thể...</option>\n            </select>\n        </div>\n\n        <div class=\"card-container\" id=\"card-render-area\"></div>\n    </div>\n\t\n\t<div id=\"report-view\">\n        <div class=\"report-card\">\n            <div class=\"report-header\">\n                <div class=\"report-title\">Báo cáo kết quả học tập</div>\n                <button class=\"report-close\" onclick=\"closeReport()\">Đóng lại</button>\n            </div>\n            \n            <div class=\"report-grid\">\n                <div class=\"report-stat-box\">\n                    <div class=\"report-stat-title\">Số bài đã làm</div>\n                    <div class=\"report-stat-value\" id=\"rp-total-lessons\">0</div>\n                </div>\n                <div class=\"report-stat-box\">\n                    <div class=\"report-stat-title\">Số câu đúng / Tổng câu</div>\n                    <div class=\"report-stat-value\" id=\"rp-correct\">0/0</div>\n                </div>\n                <div class=\"report-stat-box\">\n                    <div class=\"report-stat-title\">Band điểm ước lượng</div>\n                    <div class=\"report-stat-value text-orange-600\" id=\"rp-band\">0.0</div>\n                </div>\n            </div>\n\n            <h3 class=\"font-bold text-gray-800 text-sm mb-4 mt-6 border-b pb-2\">Độ chính xác theo từng parts</h3>\n            <div id=\"rp-accuracy-bars\"></div>\n            \n            <div class=\"flex text-xs text-gray-500 mb-6 justify-between px-4\">\n                <span>0%</span><span>20%</span><span>40%</span><span>60%</span><span>80%</span><span>100%</span>\n            </div>\n\n            <h3 class=\"font-bold text-gray-800 text-sm mb-4 mt-8 border-b pb-2\">Lịch sử làm bài (<span id=\"rp-history-count\">0</span>)</h3>\n            <div class=\"overflow-x-auto\">\n                <table class=\"history-table\">\n                    <thead><tr><th>Bài</th><th>Dạng</th><th>Điểm</th><th>Thời gian</th><th>Thời điểm</th><th></th></tr></thead>\n                    <tbody id=\"rp-history-body\"></tbody>\n                </table>\n            </div>\n        </div>\n    </div>\n\t\n    <header class=\"bg-white shadow-sm p-2 md:p-3 flex justify-between items-center z-10 h-auto min-h-[64px] shrink-0 border-b border-gray-200 gap-3\">\n        <div class=\"flex items-center gap-2 md:gap-4 shrink-0\">\n            <button class=\"back-btn !m-0\" onclick=\"goBackToDashboard()\"><i class=\"fa-solid fa-arrow-left\"></i> <span class=\"hidden lg:inline ml-1\">Quay lại</span></button>\n\t\t\t<button id=\"btn-back-report\" class=\"back-btn !m-0 hidden !bg-orange-50 !border-orange-200 !text-orange-700 hover:!bg-orange-100\" onclick=\"backToReport()\"><i class=\"fa-solid fa-arrow-left\"></i> <span class=\"hidden lg:inline ml-1\">Trở về Report</span></button>\n            <h1 class=\"text-base md:text-lg font-bold text-slate-700 flex items-center gap-1 md:gap-2\">\n                <i class=\"fa-solid fa-headphones text-blue-600\"></i> <span class=\"hidden md:inline\">Listening</span>\n                <span id=\"top-total-qs\" class=\"text-[11px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded border border-blue-200 ml-1\">0 câu</span>\n            </h1>\n            <div class=\"hidden\">\n                <select id=\"lesson-selector\" onchange=\"switchLesson(this.value)\"></select>\n            </div>\n        </div>\n\n        <div id=\"question-palette\" class=\"flex-1 flex items-center gap-1.5 overflow-x-auto px-2\" style=\"scrollbar-width: none;\">\n            </div>\n\n        <div class=\"flex gap-2 md:gap-3 items-center shrink-0\">\n            <!-- Công tắc bật chuông báo -->\n            <label class=\"flex items-center gap-1 border-r border-gray-300 pr-2 md:pr-3 mr-1 text-xs md:text-sm font-bold text-red-500 hover:text-red-600 cursor-pointer transition\" title=\"Bật chuông báo hiệu chú ý khi đến câu hỏi\">\n                <input type=\"checkbox\" id=\"bell-toggle\" class=\"accent-red-500 w-4 h-4 cursor-pointer\">\n                <i class=\"fa-solid fa-bell\"></i> <span class=\"hidden xl:inline\">Báo Chú Ý</span>\n            </label>\n\t\t\t\n\t\t\t<div class=\"flex items-center gap-1 border-r border-gray-300 pr-2 md:pr-3 mr-1\">\n                <input type=\"color\" id=\"hl-color\" value=\"#fef08a\" class=\"w-6 h-6 md:w-7 md:h-7 p-0 border-0 rounded cursor-pointer shrink-0\" title=\"Chọn màu Highlight\">\n                <button id=\"hl-toggle\" onclick=\"toggleHighlightMode()\" class=\"bg-gray-100 hover:bg-gray-200 text-gray-700 px-2 py-1 md:px-3 md:py-1 rounded text-xs md:text-sm font-bold shadow-sm transition border border-gray-300 flex items-center gap-1\">\n                    <i class=\"fa-solid fa-highlighter\"></i> <span class=\"hidden xl:inline\">Bật Highlight</span>\n                </button>\n            </div>\n            \n            <div class=\"bg-slate-100 px-2 py-1 md:px-3 md:py-1 rounded-full text-xs md:text-sm font-mono text-slate-600 border border-slate-200\" id=\"timer\">00:00</div>\n            <button onclick=\"checkResults()\" class=\"bg-green-600 hover:bg-green-700 text-white text-xs md:text-sm font-bold px-3 py-1.5 md:px-4 md:py-1.5 rounded shadow whitespace-nowrap\"><i class=\"fa-solid fa-check mr-1\"></i> Nộp Bài</button>\n        </div>\n    </header>\n    \n    <main class=\"flex-1 flex flex-col md:flex-row overflow-hidden\" id=\"main-container\">\n        <div id=\"pane-transcript\" class=\"w-full md:w-[40%] flex flex-col border-r border-gray-200 bg-white relative z-10 min-w-[250px]\">\n            <div class=\"p-4 bg-slate-900 text-white shadow-md shrink-0\">\n                <audio id=\"audio\" class=\"w-full h-10 mb-2\" controls></audio>\n                <div class=\"flex items-center justify-between\" id=\"trans-btn-container\"></div>\n            </div>\n            <div id=\"transcript-container\" class=\"flex-1 overflow-y-auto p-4 md:p-6 bg-white scroll-smooth\">\n                <div id=\"transcript\" class=\"text-base md:text-lg leading-relaxed max-w-2xl mx-auto\"></div>\n            </div>\n            <div id=\"transcript-placeholder\" class=\"hidden flex-1 flex items-center justify-center bg-slate-50 text-slate-400 p-10 text-center italic\">\n                <div><i class=\"fa-solid fa-eye-slash text-3xl mb-3\"></i><br>Transcript is currently hidden.</div>\n            </div>\n        </div>\n        \n        <div id=\"resizer-1\" class=\"resizer-bar hidden md:flex\"></div>\n\n        <div id=\"pane-right\" class=\"flex-1 flex flex-col md:flex-row overflow-hidden relative bg-slate-50\">\n            <div id=\"pane-questions\" class=\"flex-1 overflow-y-auto p-4 md:p-8 scroll-smooth min-w-[300px]\">\n                <div class=\"max-w-3xl mx-auto bg-white p-6 md:p-8 rounded-xl shadow-sm border border-gray-100 min-h-full\">\n\t\t\t\n\t\t\t\n\t\t\t<div id=\"questions-content\"></div>\n\t\t\t<div id=\"result-message\" class=\"hidden mt-6 p-4 rounded bg-blue-50 text-blue-800 text-center font-bold border border-blue-200\"></div>\n\t\t\t\n\t\t\t<div id=\"bottom-actions\" class=\"hidden mt-6 flex flex-wrap justify-between items-center gap-4 border-t pt-6\">\n\t\t\t\t<button onclick=\"saveCurrentResult()\" class=\"bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg font-bold shadow transition text-sm\">\n\t\t\t\t\t<i class=\"fa-solid fa-floppy-disk mr-1\"></i> Save Result\n\t\t\t\t</button>\n\t\t\t\t<button id=\"btn-next-lesson\" onclick=\"goToNextLesson()\" class=\"bg-sky-500 hover:bg-sky-600 text-white px-5 py-2 rounded-lg font-bold shadow transition text-sm ml-auto hidden\">\n\t\t\t\t</button>\n\t\t\t\t<button onclick=\"openReport()\" class=\"bg-orange-600 hover:bg-orange-700 text-white px-5 py-2 rounded-lg font-bold shadow transition text-sm ml-2\">\n\t\t\t\t\t<i class=\"fa-solid fa-chart-pie mr-1\"></i> Xem Report\n\t\t\t\t</button>\n    </div>\n</div>\n            </div>\n        </div>\n    </main>\n<div id=\"floating-note-btn\" onclick=\"createNote()\"><i class=\"fa-solid fa-pen-to-square mr-1\"></i> Note</div>\n    <script>\n\t\n\t// --- THIẾT LẬP API GOOGLE SHEETS ---\nconst GAS_URL = \"https://script.google.com/macros/s/AKfycby9q8OqUhEVcVdiNlB6ux0gYpnTpXYtoaJTovbp6qFV6tTZtMtqwPQByV41dJ95i-o2bg/exec\";\nlet currentStudent = { id: \"\", name: \"\" };\n\nasync function handleLogin() {\n    const id = document.getElementById('hs-id').value.trim();\n    const pass = document.getElementById('hs-pass').value.trim();\n    const btn = document.getElementById('btnLogin');\n    const msg = document.getElementById('login-msg');\n    \n    if(!id || !pass) return msg.innerText = \"Vui lòng nhập đủ ID và Mật khẩu!\";\n    \n    btn.innerText = \"ĐANG KIỂM TRA...\";\n    btn.disabled = true;\n    \n    try {\n        const formData = new URLSearchParams();\n        formData.append('action', 'login');\n        formData.append('id', id);\n        formData.append('password', pass);\n\n        const res = await fetch(GAS_URL, { method: 'POST', body: formData, redirect: 'follow' });\n        const data = await res.json();\n        \n        if(data.status === 'success') {\n            currentStudent.id = id;\n            currentStudent.name = data.name;\n            document.getElementById('login-modal').style.display = 'none';\n            alert(`Chào mừng ${data.name}! Bắt đầu làm bài.`);\n        } else {\n            msg.innerText = data.message;\n        }\n    } catch(e) {\n        msg.innerText = \"Lỗi kết nối mạng!\";\n    }\n    btn.innerText = \"ĐĂNG NHẬP\";\n    btn.disabled = false;\n}\n\nasync function sendReportToSheet(score, total, timeSpent, testNameOverride) {\n    let realTestName = testNameOverride || document.title;\n    \n    if (!testNameOverride) {\n        if (typeof currentLessonIndex !== 'undefined' && lessonsData[currentLessonIndex]) {\n            realTestName = lessonsData[currentLessonIndex].name;\n        }\n    }\n\n    const submitBtn = document.querySelector('button[onclick=\"checkResults()\"]');\n    if(submitBtn) { submitBtn.innerText = \"ĐANG GỬI...\"; submitBtn.disabled = true; }\n\n    const formData = new URLSearchParams();\n    formData.append('action', 'submitReport');\n    formData.append('id', currentStudent.id);\n    formData.append('name', currentStudent.name);\n    formData.append('testName', realTestName);\n    formData.append('score', score + \"/\" + total);\n    formData.append('time', timeSpent + \" giây\");\n    formData.append('details', \"Đã hoàn thành\");\n    formData.append('note', 'Listening'); // <--- GHI CHÚ LISTENING \n\n    try {\n        await fetch(GAS_URL, { method: 'POST', body: formData, redirect: 'follow' });\n    } catch(e) {\n        console.error(\"Lỗi khi gửi kết quả!\", e);\n    }\n    \n    if(submitBtn) { submitBtn.innerHTML = '<i class=\"fa-solid fa-check mr-1\"></i> Đã Nộp'; }\n}\n// ------------------------------------\n\t\n\twindow.playAudioFrom = function(time) {\n            const audio = document.getElementById('audio');\n            if (audio) {\n                audio.currentTime = time;\n                audio.play();\n            }\n        };\n\t\n\t// --- HIGHLIGHT & NOTE LOGIC ---\n        let isHlMode = false;\n\n        function toggleHighlightMode() {\n            isHlMode = !isHlMode;\n            const btn = document.getElementById('hl-toggle');\n            if (isHlMode) {\n                btn.classList.replace('bg-gray-100', 'bg-yellow-300');\n                btn.classList.replace('hover:bg-gray-200', 'hover:bg-yellow-400');\n                btn.classList.replace('text-gray-700', 'text-yellow-900');\n                btn.innerHTML = '<i class=\"fa-solid fa-highlighter\"></i> Đang HL...';\n            } else {\n                btn.classList.replace('bg-yellow-300', 'bg-gray-100');\n                btn.classList.replace('hover:bg-yellow-400', 'hover:bg-gray-200');\n                btn.classList.replace('text-yellow-900', 'text-gray-700');\n                btn.innerHTML = '<i class=\"fa-solid fa-highlighter\"></i> Bật Highlight';\n            }\n        }\n\n        document.addEventListener('mouseup', function(e) {\n            // Bỏ qua nếu click vào nút float\n            if(e.target.id === 'floating-note-btn') return;\n\n            const selection = window.getSelection();\n            const text = selection.toString().trim();\n            const floatBtn = document.getElementById('floating-note-btn');\n\n            // Chỉ kích hoạt khi bôi đen nội dung trong vùng làm bài\n            if (text.length > 0 && e.target.closest('#main-container')) {\n                if (isHlMode) {\n                    applyHighlight(selection);\n                    floatBtn.style.display = 'none';\n                } else {\n                    // Nếu đang tắt Highlight -> Hiện nút Note\n                    const range = selection.getRangeAt(0);\n                    const rect = range.getBoundingClientRect();\n                    floatBtn.style.display = 'block';\n                    floatBtn.style.top = (rect.top + window.scrollY - 35) + 'px';\n                    floatBtn.style.left = (rect.left + window.scrollX + (rect.width/2) - 30) + 'px';\n                    window.currentNoteRange = range.cloneRange();\n                }\n            } else {\n                floatBtn.style.display = 'none';\n            }\n        });\n\n        function applyHighlight(selection) {\n            const color = document.getElementById('hl-color').value;\n            const range = selection.getRangeAt(0);\n            const span = document.createElement('span');\n            span.className = 'user-hl';\n            span.style.backgroundColor = color;\n            span.title = \"Click để xóa highlight\";\n            \n            try {\n                range.surroundContents(span);\n            } catch(e) {\n                alert(\"Vui lòng bôi đen từng đoạn ngắn, không bôi đen chéo qua các ô trống hoặc nhiều dòng cùng lúc.\");\n            }\n            selection.removeAllRanges();\n        }\n\n        function createNote() {\n            document.getElementById('floating-note-btn').style.display = 'none';\n            const noteText = prompt(\"Nhập nội dung ghi chú cho cụm từ này:\");\n            \n            if (noteText && window.currentNoteRange) {\n                const span = document.createElement('span');\n                span.className = 'user-note';\n                span.dataset.note = noteText;\n                span.title = noteText;\n                try {\n                    window.currentNoteRange.surroundContents(span);\n                } catch(e) {\n                    alert(\"Vui lòng bôi đen đoạn văn bản liên tục, không chứa ô trống điền từ.\");\n                }\n            }\n            window.getSelection().removeAllRanges();\n        }\n\n        // Ủy quyền sự kiện click để Xóa Highlight hoặc Sửa Note\n        document.addEventListener('click', function(e) {\n            // Xóa Highlight\n            if (e.target.classList.contains('user-hl')) {\n                const parent = e.target.parentNode;\n                while (e.target.firstChild) {\n                    parent.insertBefore(e.target.firstChild, e.target);\n                }\n                parent.removeChild(e.target);\n            }\n\n            // Mở và Sửa Note\n            if (e.target.classList.contains('user-note')) {\n                const currentNote = e.target.dataset.note;\n                const newNote = prompt(\"Chỉnh sửa ghi chú (Xóa trắng để gỡ bỏ ghi chú):\", currentNote);\n                \n                if (newNote === null) return; // Nhấn Cancel\n                \n                if (newNote.trim() === \"\") {\n                    // Xóa hoàn toàn note\n                    const parent = e.target.parentNode;\n                    while (e.target.firstChild) {\n                        parent.insertBefore(e.target.firstChild, e.target);\n                    }\n                    parent.removeChild(e.target);\n                } else {\n                    // Cập nhật nội dung mới\n                    e.target.dataset.note = newNote;\n                    e.target.title = newNote;\n                }\n            }\n        });\n        const lessonsData = [{\"name\":\"EXERCISE 1\",\"audio\":\"https://englishpracticetest.net/wp-content/uploads/2021/11/ket-practice-listening-test-01-part-5.mp3\",\"image\":\"\",\"hideTrans\":false,\"removeDragged\":true,\"imgLeft\":false,\"answerKey\":{\"drop-auto-0\":\"C\",\"drop-auto-1\":\"H\",\"drop-auto-2\":\"E\",\"drop-auto-3\":\"D\",\"drop-auto-4\":\"A\"},\"itemImages\":{},\"processedTranscript\":\"\\u003cp data-time=\\\"0.549\\\">Now look at Part 5.\\u003c/p>\\n\\u003cp data-time=\\\"7.599\\\">For each question, choose the correct answer.\\u003c/p>\\n\\u003cp data-time=\\\"10.350\\\">Look at Questions 21 to 25 now.\\u003c/p>\\n\\u003cp data-time=\\\"14.375\\\">You have 15 seconds.\\u003c/p>\\n\\u003cp data-time=\\\"34.799\\\">Mum, we talked about different jobs in class today, and\\u003c/p>\\n\\u003cp data-time=\\\"38.304\\\">I\\\\'m surprised about the job some of my friends want to do.\\u003c/p>\\n\\u003cp data-time=\\\"4 49, text:'Yes, like, the hall was a long way from the rest of the school.'},\\n{t:48.319, text:'But what was wrong with the cafeteria?'},\\n{t:50.419, text:'Well, you could always hear the traffic in the street outside.'},\\n{t:55.409, text:'Or the crowds of people waiting for the buses.'},\\n{t:58.339, text:'Oh, okay.'},\\n{t:60.881, text:'And your library?'},\\n{t:62.361, text:'It wasn\\\\'t too small or anything like that.'},\\n{t:65.761, text:'Just dirty and not warm enough.'},\\n{t:69.681, text:'But were the classrooms okay?'},\\n{t:71.681, text:'Yeah, my class used the ones on the second floor.'},\\n{t:75.961, text:'But they didn\\\\'t have the latest equipment.'},\\n{t:78.601, text:'That\\\\'s a pity.'},\\n{t:80.201, text:'Was there a lift?'},\\n{t:83.161, text:'They were so slow.'},\\n{t:85.201, text:'You could walk faster.'},\\n{t:87.441, text:'I don\\\\'t know why we had them.'},\\n{t:89.400, text:'I went to your school office once.'},\\n{t:91.441, text:'There wasn\\\\'t enough space for two desks and the bookshelves.'},\\n{t:95.680, text:'But the secretary liked it and said the shelves were quite useful.'},\\n{t:99.721, text:'Oh.'},\\n{t:105.399, text:'Now listen again.'},\\n{t:109.919, text:'Uncle Edward, we\\\\'re moving into our new school next month.'},\\n{t:114.360, text:'They\\\\'ve built it next to the old one.'},\\n{t:116.600, text:'Fantastic.'},\\n{t:118.441, text:'There were some problems with your old one, weren\\\\'t there?'},\\n{t:121.721, text:'Yes.'},\\n{t:122.720, text:'Like, the hall was a long way from the rest of the school.'},\\n{t:126.840, text:'But what was wrong with the cafeteria?'},\\n{t:129.001, text:'Well, you could always hear the traffic in the street outside.'},\\n{t:133.921, text:'Or the crowds of people waiting for the buses.'},\\n{t:136.881, text:'Oh, okay.'},\\n{t:139.321, text:'And your library?'},\\n{t:140.801, text:'It wasn\\\\'t too small or anything like that.'},\\n{t:144.201, text:'Just dirty and not warm enough.'},
